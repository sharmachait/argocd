apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sharmachait/argocd
    targetRevision: HEAD
    path: apps/templates
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  syncPolicy:
    automated:
      prune: true       # Automatically delete resources no longer defined in Git
      selfHeal: true     # Automatically sync if live state deviates from Git-